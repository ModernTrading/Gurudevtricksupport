<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gurudev Trick Support</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at center, #1a1508 0%, #080808 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #141414;
      border: 2px solid #d4af37;
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.25);
    }

    /* --- LOGO ANIMATION (HALO RING + FLOAT + PULSE) --- */
    .logo-container {
      position: relative;
      width: 135px;
      height: 135px;
      margin: 0 auto 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo-container::before {
      content: '';
      position: absolute;
      width: 145px;
      height: 145px;
      border-radius: 50%;
      border: 3px dashed #f5d77f;
      animation: rotateRing 6s linear infinite;
    }
    .logo-container::after {
      content: '';
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      box-shadow: 0 0 30px #d4af37;
      animation: pulseGlow 2s ease-in-out infinite alternate;
      z-index: 1;
    }
    .logo {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      border: 2px solid #d4af37;
      object-fit: cover;
      position: relative;
      z-index: 2;
      animation: logoFloat 3s ease-in-out infinite alternate;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.95); opacity: 0.5; }
      100% { transform: scale(1.1); opacity: 1; }
    }
    @keyframes logoFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }

    /* --- NAME GOLD SHIMMER & GLOW --- */
    .title {
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      background: linear-gradient(90deg, #d4af37 0%, #ffffff 50%, #d4af37 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShimmer 2.5s linear infinite;
    }
    @keyframes textShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    /* --- MARKET ROWS --- */
    .btn-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .row-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e1e;
      border: 1px solid #333;
      padding: 12px 18px;
      border-radius: 12px;
    }
    .game-name {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
    }
    .today-btn {
      background: linear-gradient(135deg, #f5d77f, #aa7c11);
      color: #000000;
      text-decoration: none;
      font-weight: 800;
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }

    /* --- TELEGRAM JOIN BUTTON --- */
    .join-btn {
      display: block;
      background: linear-gradient(135deg, #0088cc, #005f8f);
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 800;
      padding: 15px;
      border-radius: 14px;
      border: 1.5px solid #29b6f6;
      animation: pulseBtn 1.8s infinite;
    }
    @keyframes pulseBtn {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 136, 204, 0.7); }
      70% { transform: scale(1.02); box-shadow: 0 0 0 14px rgba(0, 136, 204, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 136, 204, 0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Logo Image -->

    </div>
    
    <div class="title">Gurudev Trick Support</div>

    <div class="btn-list">
      <div class="row-btn">
        <span class="game-name">Faridabad</span>
        <a href="https://t.me/+YOsZ1RBgj344Mjk1" target="_blank" class="today-btn">TODAY</a>
      </div>
      <div class="row-btn">

        <a href="https://t.me/+YOsZ1RBgj344Mjk1" target="_blank" class="today-btn">TODAY</a>
      </div>

      </div>
      <div class="row-btn">
        <span class="game-name">Disawar</span>

</body>
